name: h3xboard
description: "Opensource whiteboard app."

publish_to: 'none'

version: 0.8.1+1

environment:
  # Deliberately 3.12, not the 3.13 the pinned Flutter ships. The lower bound is
  # this package's *language version*, and Dart 3.13 dropped support for `final`
  # on constructor parameters — which freezed 3.2.5 still emits. Staying on the
  # 3.12 language version keeps that generated code legal while everything else
  # runs on the newer SDK. Raise this only once freezed stops emitting it.
  sdk: ^3.12.0

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }

  intl: any
  meta: any
  fast_immutable_collections: 11.2.0
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  collection: any
  flutter_drawing_board: 1.0.1+2
  auto_route: 11.1.0
  fluent_ui: 4.16.1
  get_it: 9.2.1
  mobx: 2.6.0
  flutter_mobx: 2.3.0
  lucide_icons_flutter: 3.1.15
  flutter_soloud: 4.1.7
  audio_session: 0.2.4
  google_fonts: 8.2.1
  polly_dart: 0.0.9
  flutter_svg: 2.3.0
  vector_graphics: 1.2.3
  web_socket_channel: 3.0.3
  chopper: 8.7.0
  http: 1.6.0
  fetch_client: 1.2.1
  http_parser: 4.1.2
  envied: 1.3.8
  flutter_markdown_plus: 1.0.12
  web: 1.1.1
  file_selector: 1.1.0
  desktop_drop: 0.8.0
  scroll_edge_hint: 0.1.1
  shared_preferences: 2.5.5
  external_display: 0.4.3
  cookie_jar: 4.0.9
  flutter_secure_storage: 11.0.0
  pretty_qr_code: 3.6.0
  sentry_flutter: 9.27.0
  theme_tailor_annotation: 3.1.3
  form_builder_validators: 11.3.0
  flutter_form_builder: 11.0.0
  re_editor: 0.10.0
  re_highlight: 0.0.3
  rounded_background_text: 0.6.0
  h3xboard_rust:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

dependency_overrides:
  external_display:
    path: third_party/external_display
  # re_editor asks for isolate_manager ^4, whose isolate_contactor dependency
  # reaches dart:html — which does not exist under dart2wasm, and this app builds
  # with --wasm. isolate_manager 6 dropped isolate_contactor for package:web and
  # kept the API re_editor uses, so forcing it forward is what makes the wasm
  # build compile. Drop this once re_editor widens its own constraint
  # (reqable/re-editor#79).
  isolate_manager: 6.3.2

dev_dependencies:
  flutter_test: { sdk: flutter }

  build_runner: 2.15.1
  flutter_lints: 6.0.0
  freezed: 3.2.5
  json_serializable: 6.14.1
  auto_route_generator: 10.5.0
  mobx_codegen: 2.7.7
  chopper_generator: 8.7.0
  envied_generator: 1.3.8
  theme_tailor: 3.1.3
  vector_graphics_compiler: 1.3.0
  shared_preferences_platform_interface: 2.4.2
  xml: any

flutter:
  uses-material-design: true
  generate: true

  # CPython 3.14.7 built for wasm32-wasi, plus its standard library. The Python
  # Lab widget runs this exact pair on every platform — see
  # docs/python-wasm-build.md, and tool/build_python_wasm.sh to regenerate.
  # The zip is deliberately stored rather than deflated: this build has no zlib,
  # so zipimport cannot inflate a compressed entry.
  assets:
    - assets/emoji/
    - assets/emoji/vec/
    - assets/emoji/packs/
    - assets/python/python.wasm
    - assets/python/python314.zip
