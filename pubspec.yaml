name: h3xboard
description: "Opensource whiteboard app."

publish_to: 'none'

version: 0.8.1+1

environment:
  # Deliberately 3.12, not the 3.13 the pinned Flutter ships. The lower bound is
  # this package's *language version*, and Dart 3.13 dropped support for `final`
  # on constructor parameters — which freezed 3.2.5 still emits. Staying on the
  # 3.12 language version keeps that generated code legal while everything else
  # runs on the newer SDK. Raise this only once freezed stops emitting it.
  sdk: ^3.12.0

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }

  intl: any
  meta: any
  fast_immutable_collections: 12.0.0
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  collection: any
  flutter_drawing_board: 1.0.1+2
  auto_route: 11.2.0
  fluent_ui: 4.17.0
  get_it: 9.3.0
  mobx: 2.7.0
  flutter_mobx: 2.4.0
  lucide_icons_flutter: 4.0.1
  flutter_soloud: 5.2.2
  audio_session: 0.2.4
  google_fonts: 9.0.0
  polly_dart: 0.0.9
  flutter_svg: 2.3.2
  vector_graphics: 1.2.3
  web_socket_channel: 3.0.3
  chopper: 8.7.1
  http: 1.6.0
  fetch_client: 1.2.1
  http_parser: 4.1.2
  envied: 1.3.10
  flutter_markdown_plus: 1.0.12
  web: 1.1.2
  file_selector: 1.1.0
  desktop_drop: 0.8.4
  scroll_edge_hint: 0.1.1
  shared_preferences: 2.5.6
  external_display: 0.5.1
  cookie_jar: 4.0.9
  flutter_secure_storage: 11.2.0
  pretty_qr_code: 3.6.0
  sentry_flutter: 10.2.0
  theme_tailor_annotation: 4.0.0
  form_builder_validators: 11.3.0
  flutter_form_builder: 11.0.0

dependency_overrides:
  external_display:
    path: third_party/external_display

dev_dependencies:
  flutter_test: { sdk: flutter }

  build_runner: 2.16.1
  flutter_lints: 6.0.0
  freezed: 4.0.1
  json_serializable: 6.15.2
  auto_route_generator: 10.6.0
  mobx_codegen: 2.7.8
  chopper_generator: 8.7.1
  envied_generator: 1.3.10
  theme_tailor: 4.0.1
  vector_graphics_compiler: 1.3.4
  shared_preferences_platform_interface: 2.4.2
  xml: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/emoji/
    - assets/emoji/vec/
    - assets/emoji/packs/
